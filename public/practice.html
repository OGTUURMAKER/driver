<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.practice">Тест — Адуун Чулууны Нуруу</title>
    <link rel="icon" type="image/svg+xml" href="/public/assets/brand/logo-mark.svg?v=1" />
    <link rel="stylesheet" href="/public/platform.css" />
    <script src="/public/i18n.js"></script>
    <script src="/public/locales/mn.js"></script>
    <script src="/public/locales/zh.js"></script>
    <script src="/public/platform.js"></script>
  </head>
  <body>
    <div class="practice-shell">
      <header class="practice-topbar">
        <a class="icon-btn" href="/" aria-label="Нүүр хуудас руу буцах" data-i18n-attr="aria-label:practice.backHome">←</a>
        <img class="brand-logo practice-logo" src="/public/assets/brand/logo-mark.svg?v=1" width="34" height="34" alt="Адуун Чулууны Нуруу" />
        <div class="practice-title">
          <span id="chapter-title" data-i18n="chapter.placeholder">Бүлэг —</span>
          <small id="question-counter">Асуулт — / 20</small>
        </div>
        <span class="mode-chip" id="mode-chip" data-i18n="mode.learning">Сургалт</span>
        <div data-lang-switch></div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Гэрэл/харанхуй горим солих" data-i18n-attr="aria-label:common.themeToggle">🌙</button>
      </header>

      <div class="quiz-progress-track" role="progressbar" aria-label="Тестийн явц" data-i18n-attr="aria-label:practice.progressAria"
           aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="quiz-progressbar">
        <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
      </div>

      <div id="error-area"></div>

      <main id="quiz-area">
        <div class="question-card">
          <div class="question-meta">
            <span id="question-label" data-i18n="practice.questionPlaceholder">Асуулт —</span>
            <span id="exam-timer" hidden>00:00</span>
          </div>
          <div class="question-image-wrap">
            <div class="image-skeleton" id="image-skeleton"></div>
            <img class="question-image" id="question-image" alt="Асуултын зураг" data-i18n-attr="alt:practice.imageAlt" decoding="async" />
          </div>
          <div class="question-translation" id="question-translation" hidden></div>
          <div class="answers" id="answers" role="group" aria-label="Хариултын сонголтууд" data-i18n-attr="aria-label:practice.answersAria">
            <button class="answer-btn" data-answer="1" type="button">1</button>
            <button class="answer-btn" data-answer="2" type="button">2</button>
            <button class="answer-btn" data-answer="3" type="button">3</button>
            <button class="answer-btn" data-answer="4" type="button">4</button>
            <button class="answer-btn" data-answer="5" type="button">5</button>
          </div>
          <div class="feedback-area" id="feedback" role="status" aria-live="polite"></div>
        </div>

        <div class="quiz-nav">
          <button class="btn btn-ghost" id="prev-btn" type="button" data-i18n="practice.prev">← Өмнөх</button>
          <button class="btn btn-primary" id="next-btn" type="button" data-i18n="practice.next">Дараах →</button>
        </div>

        <nav class="question-dots" id="question-dots" aria-label="Асуулт руу очих" data-i18n-attr="aria-label:practice.dotsAria"></nav>
      </main>

      <main id="results-area" hidden></main>
    </div>

    <div class="mode-overlay" id="mode-overlay" hidden>
      <div class="mode-dialog" role="dialog" aria-modal="true" aria-labelledby="mode-title">
        <h2 id="mode-title" data-i18n="mode.choose">Горим сонгоно уу</h2>
        <p id="mode-chapter-label" data-i18n="chapter.placeholder">Бүлэг —</p>
        <div class="mode-options">
          <button class="mode-option" id="mode-learning" type="button">
            <div class="mo-title" data-i18n="mode.learningTitle">📖 Сургалтын горим</div>
            <div class="mo-desc" data-i18n="mode.learningDesc">Хариулт бүрийн дараа зөв хариултыг шууд харуулна. Явц хадгалагдана.</div>
          </button>
          <button class="mode-option" id="mode-exam" type="button">
            <div class="mo-title" data-i18n="mode.examTitle">⏱️ Шалгалтын горим</div>
            <div class="mo-desc" data-i18n="mode.examDesc">Жинхэнэ шалгалт шиг — дуустал хариулт харагдахгүй, төгсгөлд нь оноо болон алдаагаа харна.</div>
          </button>
        </div>
      </div>
    </div>

    <script src="/public/practice.js"></script>
  </body>
</html>
